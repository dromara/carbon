name: test

on:
  push:
    branches: [ master, v1, v2 ]
  pull_request:
    branches: [ master, v1, v2 ]
env:
  TZ: "UTC"
jobs:
  test:
    strategy:
      matrix:
        vm-os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.vm-os }}
    env:
      GO111MODULE: on
      GOPROXY: https://goproxy.cn
    steps:
      - name: Set up go
        uses: actions/setup-go@v7
        with:
          go-version: '>=1.18.0'

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create coverage file
        if: github.event_name == 'push'
        run: go test -coverprofile='coverage.txt' -covermode=atomic ./...

      - name: Test
        run: go test -race ./...

      - name: Upload coverage file
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v7
        with:
          token: ${{secrets.CODECOV_TOKEN}}

  test-min-go:
    # go.mod says go 1.18, so make sure the code still builds and passes there
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
      GOPROXY: https://goproxy.cn
    steps:
      - name: Set up go
        uses: actions/setup-go@v7
        with:
          go-version: '1.18.x'

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build
        run: go build ./...

      # vet in Go 1.18 rejects more than one %w in fmt.Errorf (allowed since
      # Go 1.20), which helper.go, language.go and parser.go use
      - name: Test
        run: go test -race -vet=off ./...
