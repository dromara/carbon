name: lint

permissions:
  contents: read

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up go
        uses: actions/setup-go@v7
        with:
          go-version: '>=1.23.0'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pin an explicit version so CI stays reproducible.
          # See https://golangci-lint.run/docs/welcome/install/ci/
          version: v2.15.0
